name: implementation-figures

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "src/**"
      - "vignettes/**"
      - "tools/implementation-figures/**"
      - .github/workflows/implementation-figures.yaml
  workflow_dispatch:
    inputs:
      families:
        description: >
          Optional comma-separated families to rebuild. Use "all" or leave
          blank to rebuild every package-side family.
        required: false
        type: string
      fail_on_drift:
        description: Fail the workflow if rebuild drift is detected
        type: boolean
        required: true
        default: false

permissions: read-all

jobs:
  implementation-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Resolve implementation figure scope
        id: scope
        env:
          ACOUSTICTS_IMPL_PROFILE: light
          ACOUSTICTS_IMPL_REQUESTED_FAMILIES: >-
            ${{ github.event_name == 'workflow_dispatch'
              && inputs.families || '' }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: source("tools/implementation-figures/resolve_changed_families.R")
        shell: Rscript {0}

      - name: Install Fortran toolchain
        if: steps.scope.outputs.scope != 'skip'
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.scope.outputs.scope != 'skip'
        with:
          extra-packages: any::devtools, local::.

      - name: Rebuild implementation figures
        if: steps.scope.outputs.scope != 'skip'
        env:
          ACOUSTICTS_IMPL_PROFILE: ${{ steps.scope.outputs.profile }}
          ACOUSTICTS_IMPL_FAMILIES: ${{ steps.scope.outputs.families }}
          ACOUSTICTS_IMPL_PROVENANCE: .tmp/implementation-figures/provenance.csv
        run: source("tools/implementation-figures/run_all.R")
        shell: Rscript {0}

      - name: Report drift
        if: steps.scope.outputs.scope != 'skip'
        run: |
          git diff --name-only -- \
            vignettes \
            tools/implementation-figures \
            > implementation_drift.txt

          if [ ! -s implementation_drift.txt ]; then
            exit 0
          fi

          echo "Detected implementation rebuild drift:"
          cat implementation_drift.txt

      - name: Save drift patch
        if: steps.scope.outputs.scope != 'skip'
        run: |
          git diff --binary -- \
            vignettes \
            tools/implementation-figures \
            > implementation_drift.patch

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.scope != 'skip'
        with:
          name: implementation-drift
          path: |
            implementation_drift.txt
            implementation_drift.patch
            .tmp/implementation-figures/provenance.csv
          if-no-files-found: warn

      - name: Enforce implementation figure drift policy
        if: steps.scope.outputs.scope != 'skip'
        run: |
          if [ ! -s implementation_drift.txt ]; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] || \
             [ "${{ inputs.fail_on_drift }}" = "true" ]; then
            echo "::error::Implementation figures/data are out of date."
            echo "Download the implementation-drift artifact from this run,"
            echo "then apply implementation_drift.patch and commit the results."
            exit 1
          fi

          echo "::warning::Implementation rebuild produced drift."
