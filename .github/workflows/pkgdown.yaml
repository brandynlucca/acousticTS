name: pkgdown

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - "R/**"
      - "src/**"
      - "man/**"
      - "vignettes/**"
      - "pkgdown/**"
      - _pkgdown.yml
      - README.md
      - README.Rmd
      - NEWS.md
      - "tools/implementation-figures/**"
      - .github/scripts/build-pkgdown-pr.R
      - .github/workflows/pkgdown.yaml
  pull_request:
    paths:
      - DESCRIPTION
      - NAMESPACE
      - "R/**"
      - "src/**"
      - "man/**"
      - "vignettes/**"
      - "pkgdown/**"
      - _pkgdown.yml
      - README.md
      - README.Rmd
      - NEWS.md
      - "tools/implementation-figures/**"
      - .github/scripts/build-pkgdown-pr.R
      - .github/workflows/pkgdown.yaml
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Fortran toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build affected pull-request documentation
        if: github.event_name == 'pull_request'
        run: source(".github/scripts/build-pkgdown-pr.R")
        shell: Rscript {0}

      - name: Build complete site
        if: github.event_name != 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
