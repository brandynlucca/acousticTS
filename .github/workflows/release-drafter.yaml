name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
