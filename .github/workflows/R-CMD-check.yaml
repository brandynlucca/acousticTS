# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '0 6 1 * *'
      
name: Build status

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    name: ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  name: 'macos-latest (release)'}
          - {os: windows-latest, r: 'release',  name: 'windows-latest (release)'}
          - {os: ubuntu-latest,  r: 'devel',    name: 'ubuntu-latest (devel)', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release',  name: 'ubuntu-latest (release)'}
          - {os: ubuntu-latest,  r: 'release',  name: 'ubuntu-clang (release)', compiler: 'clang'}
          - {os: ubuntu-latest,  r: 'oldrel-1', name: 'ubuntu-latest (oldrel-1)'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_TESTS_NLINES_: 0

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.r != 'devel' }}

      - name: Install Linux Fortran toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install and configure Clang
        if: matrix.config.compiler == 'clang'
        run: |
          sudo apt-get install -y clang
          mkdir -p ~/.R
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "CXX11=clang++"
            echo "CXX14=clang++"
            echo "CXX17=clang++"
            echo "CXX17STD=-std=gnu++17"
          } >> ~/.R/Makevars

      - name: Install macOS GNU toolchain
        if: runner.os == 'macOS'
        run: |
          if ! brew list gcc >/dev/null 2>&1; then
            brew install gcc
          fi

      - name: Configure macOS GNU toolchain
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          gxx_candidates=(
            /opt/homebrew/bin/g++-*
            /usr/local/bin/g++-*
          )
          gfortran_candidates=(
            /opt/homebrew/bin/gfortran-*
            /usr/local/bin/gfortran-*
          )
          GXX=$(printf '%s\n' "${gxx_candidates[@]}" | sort -V | tail -1)
          GFORTRAN=$(
            printf '%s\n' "${gfortran_candidates[@]}" |
              sort -V |
              tail -1
          )
          if [ -z "$GXX" ] || [ -z "$GFORTRAN" ]; then
            echo "Unable to locate the Homebrew GNU compilers." >&2
            exit 1
          fi
          GCC=${GXX/g++/gcc}
          mkdir -p ~/.R
          {
            echo "CC=$GCC"
            echo "CXX=$GXX"
            echo "CXX11=$GXX"
            echo "CXX14=$GXX"
            echo "CXX17=$GXX"
            echo "CXX17STD=-std=gnu++17"
            echo "FC=$GFORTRAN"
            echo "F77=$GFORTRAN"
          } >> ~/.R/Makevars
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_TESTS_NLINES_: 0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  check-no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (no-suggests)
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_TESTS_NLINES_: 0

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Linux Fortran toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
